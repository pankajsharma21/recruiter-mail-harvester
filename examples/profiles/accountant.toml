# Search profile. Edit any field; empty lists mean "no restriction".
[profile]
name = "Example: Accountant"
role = "Accountant"
experience_years = 2
# Cities you would work in. A post naming only other cities is dropped.
locations = ["Delhi", "Noida"]
# A post must mention at least one of these.
skills = ["accountant", "accounts", "tally", "gst"]
# A post mentioning any of these is dropped.
exclude_keywords = ["commission only"]
# Leave empty to generate queries from role + skills.
linkedin_queries = []
naukri_queries = []
# Portals to search: linkedin, naukri.
sources = ["naukri", "linkedin"]
